# 工作流目录
# 由 /help 用于确定用户所处位置以及下一步是什么。
#
# 产物检查：
#   glob: 文件 glob 模式 — 若 ≥1 个文件匹配（或满足 min_count）则完成
#   pattern: 文件中必须出现的文本模式（在 glob 之后检查）
#   min_count: 所需匹配文件的最小数量（默认：1）
#   note: 无法自动检测完成时使用的人类可读回退说明
#
# required: true → 阻止进入下一阶段（显示为 REQUIRED）
# required: false → 可选增强（显示为 OPTIONAL）
# repeatable: true → 可多次运行（每个系统、故事项等各一次）

phases:

  concept:
    label: "概念"
    description: "将你的游戏想法发展为一份文档化概念"
    next_phase: systems-design
    steps:
      - id: brainstorm
        name: "头脑风暴"
        command: /brainstorm
        required: false
        description: "使用 MDA、动词优先和玩家心理框架来探索游戏概念"

      - id: engine-setup
        name: "引擎设置"
        command: /setup-engine
        required: true
        artifact:
          glob: ".claude/docs/technical-preferences.md"
          pattern: "Engine: [^[]"
        description: "配置引擎、固定版本、设置命名约定和性能预算"

      - id: game-concept
        name: "游戏概念文档"
        command: /brainstorm
        required: true
        artifact:
          glob: "design/gdd/game-concept.md"
        description: "用支柱、MDA 分析和范围层级将概念正式化"

      - id: design-review-concept
        name: "概念评审"
        command: /design-review
        required: false
        description: "验证游戏概念（建议在继续前进行）"

      - id: map-systems
        name: "系统图谱"
        command: /map-systems
        required: true
        artifact:
          glob: "design/gdd/systems-index.md"
        description: "将概念拆解为系统，并给出依赖顺序和优先级层级"

  systems-design:
    label: "系统设计"
    description: "为系统索引中的每个系统编写一份 GDD"
    next_phase: technical-setup
    steps:
      - id: design-system
        name: "系统 GDD"
        command: /design-system
        required: true
        repeatable: true
        artifact:
          note: "检查 design/gdd/systems-index.md — 每个 MVP 系统都需要 Status: Approved"
        description: "为每个系统编写 GDD（引导式，按章节进行）。每个系统运行一次。"

      - id: design-review
        name: "单系统设计评审"
        command: /design-review
        required: true
        repeatable: true
        description: "验证每份 GDD（8 个必需部分，不得给出 MAJOR REVISION 结论）。每个系统运行一次。"

      - id: review-all-gdds
        name: "跨 GDD 评审"
        command: /review-all-gdds
        required: true
        artifact:
          glob: "design/gdd/gdd-cross-review-*.md"
        description: "对所有 GDD 同时进行整体一致性检查 + 设计理论评审"

  technical-setup:
    label: "技术准备"
    description: "架构决策、可访问性基础、引擎验证"
    next_phase: pre-production
    steps:
      - id: create-architecture
        name: "架构文档"
        command: /create-architecture
        required: true
        artifact:
          glob: "docs/architecture/architecture.md"
        description: "编写覆盖所有系统的主架构文档"

      - id: architecture-decision
        name: "架构决策（ADR）"
        command: /architecture-decision
        required: true
        repeatable: true
        artifact:
          glob: "docs/architecture/adr-*.md"
          min_count: 3
        description: "将关键技术决策记录为 ADR。至少需要 3 份基础层 ADR。"

      - id: architecture-review
        name: "架构评审"
        command: /architecture-review
        required: true
        artifact:
          glob: "docs/architecture/architecture-review-*.md"
        description: "验证完整性、依赖顺序、引擎兼容性"

      - id: control-manifest
        name: "控制清单"
        command: /create-control-manifest
        required: true
        artifact:
          glob: "docs/architecture/control-manifest.md"
        description: "由所有已接受 ADR 生成的扁平程序员规则表"

      - id: accessibility-doc
        name: "可访问性要求"
        required: true
        artifact:
          glob: "design/accessibility-requirements.md"
        description: "确定可访问性层级（基础/标准/全面/卓越）和功能矩阵。UX 规格（第 4 阶段）会引用此层级。"

  pre-production:
    label: "前期制作"
    description: "UX 规格、核心机制原型、定义故事项、验证乐趣"
    next_phase: production
    steps:
      - id: ux-design
        name: "UX 规格（关键界面）"
        command: /ux-design
        required: true
        repeatable: true
        artifact:
          glob: "design/ux/*.md"
          min_count: 1
        description: "为主菜单、核心游戏 HUD 和交互模式编写 UX 规格。读取 technical-preferences.md 中的输入方式和平台。"

      - id: ux-review
        name: "UX 评审"
        command: /ux-review
        required: true
        description: "验证所有关键界面 UX 规格是否与 GDD 对齐并符合可访问性层级要求。在创建史诗项之前运行。"

      - id: prototype
        name: "原型"
        command: /prototype
        required: true
        artifact:
          glob: "prototypes/*/README.md"
          min_count: 1
        description: "在隔离工作树中构建一次性原型以验证核心机制"

      - id: create-epics
        name: "创建史诗项"
        command: /create-epics
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/*/EPIC.md"
          min_count: 1
        description: "将 GDD + ADR 转换为史诗项——每个架构模块一个。按层运行：先 /create-epics layer: foundation，再 /create-epics layer: core"

      - id: create-stories
        name: "创建故事项"
        command: /create-stories
        required: true
        repeatable: true
        artifact:
          glob: "production/epics/**/*.md"
          min_count: 2
        description: "把每个史诗项拆分为可实现的故事项文件。按史诗项运行：/create-stories [epic-slug]"

      - id: sprint-plan
        name: "首个冲刺计划"
        command: /sprint-plan
        required: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          min_count: 1
        description: "用来自史诗项的优先级故事项规划第一个冲刺"

      - id: vertical-slice
        name: "垂直切片（已游戏试玩测试）"
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 1
        description: "可玩的端到端核心循环，经过 ≥3 次游戏试玩测试。硬性门槛。"

  production:
    label: "制作"
    description: "基于冲刺的功能开发——选择、实现、关闭故事项"
    next_phase: polish
    steps:
      - id: sprint-plan
        name: "冲刺计划"
        command: /sprint-plan
        required: true
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
        description: "用优先级明确、已就绪的故事项规划当前冲刺"

      - id: story-readiness
        name: "故事项就绪检查"
        command: /story-readiness
        required: false
        description: "在开发者接手之前验证故事项是否已准备好实施"

      - id: implement
        name: "实现故事项"
        command: /dev-story
        required: true
        repeatable: true
        artifact:
          note: "检查 src/ 中的活动代码，以及 production/epics/**/*.md 中的 In Progress 故事项"
        description: "选择下一个已就绪的故事项并用 /dev-story [story-path] 实现它。路由到正确的程序员代理。然后运行 /code-review 和 /story-done。"

      - id: story-done
        name: "故事项完成评审"
        command: /story-done
        required: true
        repeatable: true
        description: "验证所有验收标准，检查与 GDD/ADR 的偏离，关闭故事项"

      - id: scope-check
        name: "范围检查"
        command: /scope-check
        required: false
        repeatable: true
        artifact:
          glob: "production/sprints/sprint-*.md"
          note: "在冲刺中途添加故事项时，或在冲刺回顾之前运行"
        description: "通过比较当前冲刺范围与原始史诗项范围来检测范围蔓延。在 (a) 冲刺中途添加故事项时，或 (b) 冲刺回顾之前运行。"

      - id: sprint-status
        name: "冲刺状态"
        command: /sprint-status
        required: false
        description: "无需完整报告的 30 行冲刺进度快照"

  polish:
    label: "打磨"
    description: "性能、平衡、游戏试玩测试、修复 bug"
    next_phase: release
    steps:
      - id: perf-profile
        name: "性能剖析"
        command: /perf-profile
        required: false
        description: "分析并优化 CPU/GPU/内存瓶颈"

      - id: balance-check
        name: "平衡检查"
        command: /balance-check
        required: false
        description: "分析游戏平衡公式和数据中的异常值与失衡进度"

      - id: asset-audit
        name: "资源审计"
        command: /asset-audit
        required: false
        description: "验证命名约定、文件格式标准和大小预算"

      - id: playtest-polish
        name: "游戏试玩测试会话（×3）"
        command: /playtest-report
        required: true
        artifact:
          glob: "production/playtests/*.md"
          min_count: 3
        description: "覆盖：新玩家体验、中期游戏系统、难度曲线"

      - id: team-polish
        name: "打磨团队通关"
        command: /team-polish
        required: true
        description: "跨性能、音频、视觉和 UX 的协调打磨通关"

  release:
    label: "发布"
    description: "上线准备、认证与交付"
    next_phase: null
    steps:
      - id: release-checklist
        name: "发布检查清单"
        command: /release-checklist
        required: true
        description: "跨所有部门的发布前验证：代码、内容、商店、法律"

      - id: patch-notes
        name: "补丁说明"
        command: /patch-notes
        required: false
        description: "根据 git 历史和冲刺数据生成面向玩家的补丁说明"

      - id: changelog
        name: "变更日志"
        command: /changelog
        required: false
        description: "从提交、冲刺和设计文档自动生成内部变更日志"

      - id: launch-checklist
        name: "上线检查清单"
        command: /launch-checklist
        required: true
        description: "最终上线就绪检查——在交付给玩家之前的最后一道门"